<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Service</title>
  <link rel="stylesheet" href="/src/style.css">
  <!-- Markdown & Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>AI Code Service</h1>
      <button id="btn-new-chat" title="新建对话">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="sidebar-section">
      <label class="sidebar-label">模型选择</label>
      <select id="model-select">
        <option value="">加载中...</option>
      </select>
    </div>

    <div class="sidebar-section">
      <label class="sidebar-label">对话历史</label>
      <div id="chat-history"></div>
    </div>

    <div class="sidebar-footer">
      <div class="backend-status" id="backend-status">
        <span class="status-dot"></span>
        <span class="status-text">连接中...</span>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main id="chat-main">
    <div id="chat-header">
      <button id="btn-toggle-sidebar" title="切换侧栏">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="header-model-switcher">
        <select id="header-model-select" title="切换模型">
          <option value="">加载中...</option>
        </select>
        <svg class="model-switcher-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>

    <div id="chat-messages">
      <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-icon">🤖</div>
        <h2>AI Code Service</h2>
        <p>基于 Qwen 大模型的 AI 编程助手</p>
        <div class="quick-prompts">
          <button class="prompt-btn" data-prompt="解释 Python 中的装饰器模式，并给出实际使用示例">
            <span class="prompt-icon">💡</span>
            <span>解释装饰器模式</span>
          </button>
          <button class="prompt-btn" data-prompt="写一个 Python 函数实现快速排序算法，要求代码简洁并有详细注释">
            <span class="prompt-icon">⚡</span>
            <span>实现快速排序</span>
          </button>
          <button class="prompt-btn" data-prompt="帮我 review 以下代码并给出优化建议：\ndef process(data):\n    result = []\n    for item in data:\n        result.append(item)\n    return result">
            <span class="prompt-icon">🔍</span>
            <span>代码审查示例</span>
          </button>
          <button class="prompt-btn" data-prompt="用 Go 语言实现一个简单的 HTTP 服务器，支持路由和 JSON 响应">
            <span class="prompt-icon">🚀</span>
            <span>Go HTTP 服务器</span>
          </button>
        </div>
      </div>
    </div>

    <div id="chat-input-area">
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="输入消息... (Shift+Enter 换行，Enter 发送)" rows="1"></textarea>
        <button id="btn-send" title="发送" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <button id="btn-stop" title="停止生成" class="hidden">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="model-badge" id="model-badge">--</span>
        <span class="hint">Enter 发送 · Shift+Enter 换行</span>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
