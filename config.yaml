# AI Code Service 配置文件

server:
  host: "0.0.0.0"
  port: 1235
  reload: false
  cors_origins:
    - "*"
  # api_key: "sk-aicodeservice-secret"  # 可选：设置 API Key 鉴权

# 深度性能优化与显存调优 (针对 Apple Silicon 统一内存与 Code Agent 场景调优)
performance:
  enable_cache: true               # 启用响应与 Prompt LRU 缓存（高频重复代码查询命中返回 <1ms）
  cache_max_size: 1024              # 缓存最大条目数
  cache_ttl_seconds: 3600           # 缓存过期时间（秒）
  max_concurrency: 3                # 并发生成信号量 (256K 上下文推荐 2~3 并发)
  metal_cache_limit_mb: 8192        # Apple Silicon MLX Metal 显存缓存上限 (8GB，满足 Flash-Next/27B 峰值需求)
  clear_cache_after_generation: false # 是否在单次大文本生成后主动清理显存碎片
  stream_chunk_size: 1              # 流式响应 Token 聚合块大小
  kv_bits: 8                        # 🚀 KV Cache 量化位数 (8bit 节省 50% 显存，长代码文本提速 30%~50%)
  kv_group_size: 64                 # KV Cache 量化 Group 大小
  prefill_step_size: 2048           # 🚀 分块预填充 (Chunked Prefill, 压低 128K/256K 超大代码上下文峰值显存)
  enable_prompt_cache: true         # Qwen4Exp 完整状态快照，匹配 token 前缀后增量预填充
  prompt_cache_max_entries: 4       # 每个 Qwen4Exp 引擎最多保存 4 个 LRU 前缀快照
  prompt_cache_max_tokens: 8192     # 每个快照最多覆盖 8192 tokens；不限制模型上下文长度
  enable_mtp: true                  # Qwen4Exp 贪婪 MTP；拒绝草稿时恢复完整状态并重放
  mtp_depth: 3                      # 草稿深度 1~3，收益取决于接受率与回放开销
  code_agent_mode: true             # 🚀 Code Agent 专项加速模式 (低温确定性采样、工具闭合标签立即截断)
  default_temperature: 0.0          # 🚀 Code Agent 默认温度 (0.0 确定性输出使草稿命中率由 5.7% 跃升至 50%+)


# 默认模型：Qwen3.8 Flash Next oQ4e MTP 128K
default_model: "qwen3.8-flash-next-oq4e-mtp-128k"

# 是否在未加载模型权重时全局使用 Mock 模式（用于测试/无GPU环境）
use_mock: false

# 编程助手默认 System Prompt
system_prompt: |
  你是一个专业的 AI 编程助手。你的职责是：
  1. 帮助开发者编写、调试、重构和优化代码
  2. 解释代码逻辑和技术概念并生成清晰的代码注释
  3. 提供最佳实践和设计模式建议
  4. 支持多种编程语言和框架

  回答时请：
  - 直接输出解答内容与完整的带注释代码，不要输出 <tool_call> 标签。
  - 代码示例要完整、可运行、包含详细规范的注释。
  - 解释要清晰简洁，遵循行业最佳实践。
  - 如果用户未提供具体代码片段，请直接引导用户提供目标代码或在编辑器中选中代码。

# 模型配置 (支持多架构: qwen4_exp / qwen3_5 / qwen3_moe 等)
models:
  qwen3.8-flash-next-oq4e-mtp-128k:
    path: "jedisct1/Qwen3.8-Flash-Next-oQ4e-MTP-128k"
    description: "Qwen3.8 Flash Next oQ4e MTP 128K (Qwen4Exp 架构，内置 MoE MTP，支持 128K 上下文)"
    engine_type: "qwen4_exp"
    context_length: 131072

  qwen3.8-27b-oq4e-fp16-mtp:
    path: "./models/Qwen3.8-27B-oQ4e-fp16-mtp"
    description: "Qwen3.8-27B 本地 MLX oQ 混合精度 4bit 模型 + MTP 推测解码 (支持 256K 上下文)"
    engine_type: "mlx_lm"
    context_length: 262144

  qwen3.8-27b-4bit-custom:
    path: "./models/qwen3.8-27b-mlx-4bit"
    description: "Qwen3.8-27B 本地定制 MLX 4bit 量化加速版 (支持 256K 上下文)"
    engine_type: "mlx_vlm"
    context_length: 262144

  qwen3.8-27b-8bit-mtp:
    path: "./models/qwen3.8-27b-8bit-mtp"
    description: "Qwen3.8-27B MLX 8bit + MTP 完整综合加速版 (支持 256K 上下文)"
    engine_type: "mlx_lm"
    context_length: 262144

  qwen3.8-27b-8bit:
    path: "lmstudio-community/Qwen3.8-27B-MLX-8bit"
    description: "Qwen3.8-27B MLX 8bit 量化版本 (支持 256K 上下文)"
    engine_type: "mlx_lm"
    context_length: 262144

  qwen3.8-27b-mlx:
    path: "inferencerlabs/Qwen3.8-27B-MTP-MLX"
    description: "Qwen3.8-27B MLX MTP 辅助层 (238MB)"
    engine_type: "mlx_vlm"
    context_length: 262144

